{% set name = "filelock" %}
{% set version = "4.2.7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 31f6f7e3a8b6f0bd89114d30c5d5218ea1cfb63e5c4aa695b7559314a209bc7f

build:
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation . -vv
  skip: true  # [py<311]

requirements:
  host:
    - pip
    - python
    - hatch-fancy-pypi-readme >=25.1
    - hatch-vcs >=0.5
    - hatchling >=1.29
  run:
    - python

{% set deselect_tests = "" %}
# These tests rely on rename/symlink and timing semantics of the worker
# filesystem; they pass on linux-64, osx-arm64 and win-64 but fail on linux-aarch64.
{% set deselect_tests = deselect_tests + " --deselect tests/test_soft_stale.py::test_stale_break_racing_a_successor_admits_no_third_holder" %}  # [linux and aarch64]
{% set deselect_tests = deselect_tests + " --deselect tests/test_util.py::test_break_lock_file_never_links_a_symlink_swapped_in_before_the_take" %}  # [linux and aarch64]
{% set deselect_tests = deselect_tests + " --deselect tests/test_util.py::test_break_lock_file_never_links_a_symlink_swapped_in_under_the_break_name" %}  # [linux and aarch64]
# AssertionError: assert (42, 'a soft-lock marker left by pid 1016 on r9hbagnruwnujet, which has exited', True)
{% set deselect_tests = deselect_tests + " --deselect tests/test_strict_soft_failures.py::test_strict_soft_exited_soft_lock_owner_raises_without_waiting" %}  # [win and arm64]
# The test releases an oplock from a threading.Timer(1.0) and asserts the waiter blocked for >= 1s; on win-arm64 the
# timer fires a few ms early (measured 0.995-0.998s), so the assertion misses. Seen twice on py3.13, green on py3.12/3.14.
{% set deselect_tests = deselect_tests + " --deselect tests/test_read_write.py::test_read_write_lock_waits_for_an_oplock_holder_that_answers" %}  # [win and arm64 and py==313]

test:
  source_files:
    - pyproject.toml
    - docs
    - tasks
    - tests
  imports:
    - filelock
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # got this error only on that platform, check in next releases if it fixed
    # [Errno 66] Directory not empty: 
    - pytest -vv tests {{ deselect_tests }}  # [not (osx and py==312)]
  requires:
    - pip
    - pytest
    - pytest-asyncio
    - pytest-mock
    - pytest-timeout
    - virtualenv

about:
  home: https://github.com/tox-dev/py-filelock
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A platform independent file lock.
  description: |
    A filelock provides a synchronization mechanism between different
    instances of your application, similar to a thread lock. It can be
    used to signalize that files, directories or other resources are
    currently used or manipulated (Think of a sync.lock file). Only the
    existence of the lockfile is watched for this purpose. The file itself
    can not be written and is always empty.
  doc_url: https://py-filelock.readthedocs.io
  dev_url: https://github.com/tox-dev/py-filelock

extra:
  recipe-maintainers:
    - jakirkham
    - mariusvniekerk
